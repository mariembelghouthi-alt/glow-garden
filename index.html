<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glow Garden</title>
<meta name="description" content="Your daily habit garden">
<meta name="theme-color" content="#fde7f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Glow Garden">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Patrick+Hand&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fff5fa; --bg-grad: linear-gradient(180deg, #fff5fa 0%, #fdf0ff 100%);
  --card: #ffffff; --text: #5b2a4e; --muted: #9d4b83; --soft: #b77aa6;
  --accent: #ec4899; --head: #c2185b; --line: #fbe4f0; --chip: #fbe4f0; --chip2: #f3e8ff;
  --shadow: 0 6px 22px rgba(236,72,153,.13); --input: #f9f0ff;
  --hand: 'Patrick Hand', 'Comic Sans MS', cursive; --meme: 'Anton', Impact, 'Arial Black', sans-serif;
}
body.dark {
  --bg: #1c1027; --bg-grad: linear-gradient(180deg, #1c1027 0%, #221231 100%);
  --card: #2a1a3a; --text: #f8e1f4; --muted: #d8b4fe; --soft: #c9a3d9;
  --accent: #f472b6; --head: #f9a8d4; --line: #4a2d63; --chip: #3b2352; --chip2: #35204a;
  --shadow: 0 6px 22px rgba(0,0,0,.35); --input: #241532;
}
body.lazy:not(.dark) { --bg-grad: linear-gradient(180deg, #eef2ff 0%, #f5f3ff 60%, #fdf2f8 100%); --head: #7c3aed; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { font-family: 'Quicksand', system-ui, sans-serif; color: var(--text); background: var(--bg-grad);
       background-attachment: fixed; min-height: 100vh; font-weight: 600; }
button, input, select, textarea { font-family: inherit; color: inherit; }
button { cursor: pointer; }
h1 { font-size: 1.75rem; color: var(--head); margin: 6px 0 14px; font-weight: 700; }
.sec { font-weight: 700; color: var(--head); font-size: 1.25rem; margin: 22px 0 10px; }
.box-title { font-weight: 700; color: var(--head); font-size: 1.05rem; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
.card { background: var(--card); border-radius: 22px; padding: 14px 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
.muted { color: var(--muted); } .soft { color: var(--soft); font-size: .85rem; }
.row { display: flex; gap: 10px; align-items: center; }
.spacer { flex: 1; }

/* ---------- header, drawer, bottom nav ---------- */
header { position: sticky; top: 0; z-index: 50; display: flex; align-items: center; gap: 10px;
         padding: calc(env(safe-area-inset-top) + 8px) 16px 8px; background: color-mix(in srgb, var(--bg) 85%, transparent);
         backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
header .brand { font-weight: 700; color: var(--head); font-size: 1.05rem; }
.icon-btn { border: none; background: var(--card); width: 40px; height: 40px; border-radius: 14px; font-size: 1.2rem;
            box-shadow: var(--shadow); }
main { max-width: 1100px; margin: 0 auto; padding: 4px 16px calc(96px + env(safe-area-inset-bottom)); }
body.page-garden main { padding-right: 44px; }
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; display: flex; justify-content: space-around;
           background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
           box-shadow: 0 -4px 20px rgba(157,23,77,.12); padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); }
nav.tabs button { border: none; background: none; display: flex; flex-direction: column; align-items: center; gap: 2px;
                  font-size: .68rem; font-weight: 700; color: var(--soft); padding: 4px 10px; border-radius: 14px; min-width: 70px; }
nav.tabs button span { font-size: 1.35rem; line-height: 1.1; }
nav.tabs button.active { color: var(--head); background: var(--chip); }
.drawer-bg { position: fixed; inset: 0; background: rgba(40,10,40,.35); z-index: 90; display: none; }
.drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(340px, 88vw); z-index: 100; overflow-y: auto;
          background: linear-gradient(180deg, #fde7f3 0%, #efe3ff 100%); padding: calc(env(safe-area-inset-top) + 18px) 16px 30px;
          transform: translateX(-105%); transition: transform .3s ease; }
body.dark .drawer { background: linear-gradient(180deg, #2b1438 0%, #1f1230 100%); }
body.drawer-open .drawer { transform: none; } body.drawer-open .drawer-bg { display: block; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { border: 2px solid var(--line); background: var(--card); border-radius: 99px; padding: 6px 12px; font-weight: 700; font-size: .85rem; }
.seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }

/* ---------- buttons, inputs ---------- */
.btn { border: none; border-radius: 99px; padding: 10px 16px; font-weight: 700; background: var(--card); color: var(--text);
       box-shadow: 0 2px 10px rgba(157,23,77,.12); font-size: .92rem; }
.btn.primary { background: linear-gradient(120deg, #f472b6, #ec4899); color: #fff; }
.btn.soft { background: var(--chip); box-shadow: none; }
.btn.small { padding: 6px 12px; font-size: .8rem; }
.btn:active { transform: scale(.96); }
input[type=text], input[type=number], input[type=date], input[type=time], select {
  width: 100%; border: 2px solid var(--line); background: var(--input); border-radius: 14px; padding: 10px 12px; font-size: 1rem; font-weight: 600; }
label.lbl { display: block; font-size: .8rem; color: var(--muted); margin: 8px 0 4px; font-weight: 700; }
details > summary { list-style: none; cursor: pointer; } details > summary::-webkit-details-marker { display: none; }

/* ---------- lazy ---------- */
.lazy-btn { border: none; border-radius: 99px; padding: 11px 20px; color: #fff; font-weight: 800; font-size: 1rem; letter-spacing: .3px;
            background: linear-gradient(120deg, #a5b4fc, #c084fc 50%, #f9a8d4); background-size: 200% 200%;
            box-shadow: 0 6px 18px rgba(139,92,246,.35); animation: shimmer 4s ease infinite; }
.lazy-banner { position: relative; overflow: hidden; border-radius: 26px; padding: 20px 22px; color: #3b0764; margin-bottom: 10px;
               background: linear-gradient(120deg, #c7d2fe, #e9d5ff 55%, #fbcfe8); box-shadow: 0 10px 30px rgba(124,58,237,.25);
               display: flex; align-items: center; gap: 18px; }
.lazy-emoji { font-size: 3.6rem; display: inline-block; animation: sway 3.2s ease-in-out infinite; transform-origin: 50% 90%; }
.lazy-title { font-family: var(--meme); font-size: 1.6rem; text-transform: uppercase; letter-spacing: 1px; }
.lazy-msg { font-weight: 600; margin-top: 2px; }
.zzz { position: absolute; font-family: var(--meme); color: #ffffffcc; font-size: 1.5rem; animation: floatZ 4s ease-in infinite; }
.zzz.z1 { right: 18%; bottom: 8px; } .zzz.z2 { right: 12%; bottom: 8px; animation-delay: 1.3s; font-size: 1.1rem; }
.zzz.z3 { right: 6%; bottom: 8px; animation-delay: 2.6s; font-size: 1.9rem; }
.back-btn { border: none; border-radius: 99px; padding: 10px 18px; color: #fff; font-weight: 800;
            background: linear-gradient(120deg, #f472b6, #fb923c); box-shadow: 0 6px 16px rgba(236,72,153,.35); margin-bottom: 14px; }
.lazy-party { position: fixed; inset: 0; z-index: 1000; pointer-events: none; overflow: hidden;
              background: radial-gradient(circle at 50% 45%, #ede9fecc, #c7d2fe99 60%, #fbcfe866); animation: lpFade 5.2s ease forwards; }
.lp-float { position: absolute; left: -12%; animation-name: lpDrift; animation-timing-function: ease-in-out; animation-fill-mode: both; }
.lp-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; animation: lpPop 1.2s cubic-bezier(.34,1.56,.64,1) both; }
.lp-sloth { font-size: 5rem; display: inline-block; animation: sway 1.6s ease-in-out infinite; transform-origin: 50% 10%; }
.lp-text { font-family: var(--meme); font-size: 2.4rem; color: #6d28d9; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 3px 0 #fff; }
.lp-sub { font-weight: 700; color: #7c3aed; }

/* ---------- garden ---------- */
.garden-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
.garden.perfect { box-shadow: 0 0 0 3px #f9a8d4, 0 8px 28px rgba(236,72,153,.3); }
.beds { display: flex; flex-wrap: wrap; justify-content: space-around; gap: 12px 6px; margin-top: 8px; }
.bloom { position: relative; width: 30%; max-width: 110px; text-align: center; }
.bloom-ring { position: relative; width: 72px; height: 72px; margin: 0 auto; border-radius: 50%; }
.bloom-ring svg { width: 72px; height: 72px; }
.bring-bg { fill: var(--input); stroke: var(--line); stroke-width: 7; }
.bring-fg { fill: none; stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset 1s ease; }
.bloom-icon { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; }
.bloom-stage { position: absolute; right: -4px; bottom: -4px; width: 28px; height: 28px; border-radius: 50%; background: var(--card);
               display: flex; align-items: center; justify-content: center; font-size: 1rem; box-shadow: 0 2px 8px rgba(194,24,91,.2); }
.bloom-name { margin-top: 6px; font-weight: 700; font-size: .82rem; }
.bloom-count { font-size: .75rem; font-weight: 700; color: var(--soft); }
.bloom.done .bloom-count { color: var(--accent); }
.bloom.done .bloom-ring { box-shadow: 0 0 18px rgba(236,72,153,.45); }
.anim .bloom.done .bloom-ring { animation: bloomPop .8s cubic-bezier(.34,1.56,.64,1) both; }
.bloom.done .bloom-stage { animation: bob2 1.8s ease-in-out infinite; }
.spark { position: absolute; font-size: .85rem; animation: twinkle 1.6s ease-in-out infinite; }
.spark.s1 { top: -6px; left: 4px; } .spark.s2 { top: 8px; right: -4px; animation-delay: .5s; } .spark.s3 { bottom: 26px; left: -4px; animation-delay: 1s; }
.perfect-msg { margin-top: 10px; text-align: center; font-weight: 700; color: var(--head); }

/* ---------- water ---------- */
.two { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 760px) { .two { grid-template-columns: 1fr 1.35fr; } }
.water { display: flex; align-items: center; gap: 18px; }
.glass { position: relative; width: 84px; height: 118px; flex-shrink: 0; overflow: hidden; border-radius: 6px 6px 28px 28px;
         background: rgba(255,255,255,.75); border: 4px solid #e9d5ff; box-shadow: 0 6px 18px rgba(147,197,253,.35), inset 0 0 0 3px #fff; }
body.dark .glass { background: rgba(255,255,255,.05); border-color: #6b4a8a; box-shadow: inset 0 0 0 3px #2a1a3a; }
.liquid { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: linear-gradient(180deg, #a5c8ff, #8b9cf7);
          transition: height 1.1s cubic-bezier(.34,1.56,.64,1); }
.wave { position: absolute; left: 0; width: 200%; height: 14px; top: -13px; animation: waveMove 2.6s linear infinite; }
.wave path { fill: #a5c8ff; } .wave.w2 { top: -10px; opacity: .6; animation-duration: 4.2s; animation-direction: reverse; } .wave.w2 path { fill: #c4b5fd; }
.bubble { position: absolute; bottom: 0; width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.8); animation: rise 3s ease-in infinite; }
.bubble.b1 { left: 22%; } .bubble.b2 { left: 55%; width: 5px; height: 5px; animation-delay: 1s; } .bubble.b3 { left: 74%; animation-delay: 2s; }
.water-info b { font-size: 1.7rem; display: block; line-height: 1.1; }
.water-info small { color: var(--soft); }
.water-info .hint { font-size: .82rem; color: var(--muted); margin-top: 6px; }
.water-btns { display: flex; gap: 8px; margin-top: 12px; } .water-btns .btn { flex: 1; padding: 9px 4px; }

/* ---------- reminders (sticky notes) ---------- */
.rem { background-image: radial-gradient(#f9a8d455 1.2px, transparent 1.4px) !important; background-size: 16px 16px !important; }
body.dark .rem { background-image: radial-gradient(#f472b630 1.2px, transparent 1.4px) !important; }
.rem-count { margin-left: auto; background: var(--accent); color: #fff; font-weight: 700; font-size: .72rem; border-radius: 99px; padding: 2px 10px; }
.rem-count.calm { background: #c4b5fd; }
.bell { display: inline-block; transform-origin: 50% 0; } .bell.ringing { animation: bellring 2.8s ease-in-out infinite; }
.board { display: flex; flex-wrap: wrap; gap: 16px 12px; margin-top: 12px; padding: 4px 2px 6px; }
.note { position: relative; flex: 1 1 200px; padding: 18px 14px 12px; border-radius: 4px 4px 14px 4px; color: #5b2a4e;
        box-shadow: 0 6px 14px rgba(157,23,77,.16); }
.anim .note { animation: noteIn .55s cubic-bezier(.34,1.56,.64,1) both; }
.note::before { content: ""; position: absolute; top: -9px; left: 50%; width: 64px; height: 18px; transform: translateX(-50%) rotate(-3deg);
                border-radius: 2px; background: repeating-linear-gradient(45deg, #ffffffb0 0 6px, #fbcfe8b0 6px 12px); }
.n0 { background: #ffe4ef; transform: rotate(-1.6deg); } .n1 { background: #efe3ff; transform: rotate(1.3deg); }
.n2 { background: #ffedd5; transform: rotate(-0.8deg); } .n3 { background: #dcfce7; transform: rotate(1.8deg); }
.n4 { background: #e0f2fe; transform: rotate(-1.2deg); }
.note-head { font-family: var(--hand); font-size: 1.25rem; line-height: 1.15; display: flex; align-items: center; gap: 8px; }
.note-sub { font-size: .8rem; font-weight: 600; color: #9d4b83; margin-top: 4px; }
.rpill { display: inline-block; padding: 3px 10px; border-radius: 99px; font-weight: 700; font-size: .78rem; color: #5b2a4e;
         margin: 5px 5px 0 0; background: #ffffffb3; }

/* ---------- meme ---------- */
.meme { margin: 4px 0 14px; border-radius: 22px; padding: 14px 18px; color: #fff; background: linear-gradient(120deg, #ff9ac8, #c084fc);
        display: flex; align-items: center; gap: 16px; box-shadow: 0 8px 24px rgba(236,72,153,.3); }
.meme-emoji { font-size: 2.8rem; display: inline-block; animation: wiggle 1.4s ease-in-out infinite; }
.meme-top, .meme-bottom { font-family: var(--meme); text-transform: uppercase; letter-spacing: 1px; line-height: 1.15;
  text-shadow: 2px 2px 0 #9d174d, -1px -1px 0 #9d174d, 1px -1px 0 #9d174d, -1px 1px 0 #9d174d; }
.meme-top { font-size: 1.4rem; } .meme-bottom { font-size: .95rem; }

/* ---------- week grid ---------- */
.week-nav { display: flex; align-items: center; gap: 8px; margin: 18px 0 8px; }
.week-nav .label { flex: 1; text-align: center; font-weight: 700; color: var(--muted); }
.week-nav .btn { padding: 8px 14px; }
.grid { display: grid; grid-template-columns: repeat(7, 1fr) 46px; gap: 6px 4px; align-items: center; }
.grid .h-name { display: none; }
.day-head { text-align: center; color: var(--muted); font-size: .7rem; line-height: 1.2; padding: 4px 0; border-radius: 12px; }
.day-head b { font-size: .95rem; display: block; }
.day-head.today { background: var(--accent); color: #fff; box-shadow: 0 3px 10px rgba(236,72,153,.35); }
body.lazy:not(.dark) .day-head.today { background: #7c3aed; }
.day-head.weekend { background: var(--chip2); }
.streak-h, .streak { text-align: center; font-weight: 700; color: var(--muted); font-size: .78rem; line-height: 1.2; }
.streak small { display: block; font-weight: 600; color: var(--soft); font-size: .7rem; }
.cat-head { grid-column: 1 / -1; margin: 12px 0 0; font-weight: 700; color: var(--head); font-size: 1rem; display: flex; align-items: center; gap: 8px; }
.cat-head small { color: var(--muted); font-weight: 700; font-size: .72rem; background: var(--chip); border-radius: 99px; padding: 2px 10px; }
.cat-head small.ok { background: var(--accent); color: #fff; }
.habit-pill { grid-column: 1 / -1; padding: 7px 12px; border-radius: 14px; font-weight: 700; color: var(--text);
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 6px solid; margin-top: 4px; }
.days-tag { display: inline-block; margin-left: 8px; font-size: .66rem; font-weight: 700; color: var(--muted); background: #ffffffaa;
            border-radius: 99px; padding: 1px 7px; vertical-align: middle; }
body.dark .days-tag { background: #ffffff18; }
.cell { justify-self: center; width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--c); background: var(--card);
        color: var(--c); font-size: 1rem; font-weight: 700; padding: 0; display: flex; align-items: center; justify-content: center;
        transition: transform .15s ease; }
.cell:active { transform: scale(.85); }
.cell.on { background: var(--c); color: var(--t); }
.cell.rest { border-style: dashed; border-color: #e9d5ff; color: #d8b4fe; background: transparent; }
body.dark .cell.rest { border-color: #4a2d63; color: #6b4a8a; }
.cell.future { opacity: .3; pointer-events: none; }
.cell.num { font-size: .8rem; }
@media (min-width: 760px) {
  .grid { grid-template-columns: minmax(170px, 1.7fr) repeat(7, 1fr) 60px; gap: 8px 6px; }
  .grid .h-name { display: block; font-weight: 700; }
  .habit-pill { grid-column: auto; margin-top: 0; }
  .cell { width: 42px; height: 42px; font-size: 1.15rem; }
}
.progress { height: 12px; background: var(--chip); border-radius: 99px; overflow: hidden; margin: 6px 0; }
.progress > div { height: 100%; border-radius: 99px; background: linear-gradient(90deg, #f9a8d4, #ec4899); transition: width .8s ease; }

/* ---------- today bar ---------- */
.tbar { position: fixed; right: 6px; top: 50%; transform: translateY(-50%); z-index: 40; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.tbar-track { width: 18px; height: 42vh; background: var(--chip); border-radius: 99px; position: relative; border: 2px solid var(--card);
              box-shadow: inset 0 2px 6px rgba(194,24,91,.18), 0 6px 18px rgba(236,72,153,.25); }
.tbar-fill { position: absolute; bottom: 0; left: 0; right: 0; height: 0; border-radius: 99px;
             background: linear-gradient(0deg, #ec4899, #f472b6 55%, #c084fc); transition: height 1.1s cubic-bezier(.34,1.56,.64,1); }
.tbar-fill.full { box-shadow: 0 0 18px rgba(236,72,153,.7); }
.tbar-heart { position: absolute; top: -13px; left: 50%; font-size: 1.1rem; animation: bob 1.6s ease-in-out infinite; }
.tbar-count { font-weight: 700; color: var(--muted); font-size: .7rem; }
@media (min-width: 760px) { .tbar { right: 22px; } .tbar-track { width: 30px; height: 54vh; } .tbar-heart { font-size: 1.4rem; top: -16px; } body.page-garden main { padding-right: 80px; } }

/* ---------- planner ---------- */
.corkboard { border-radius: 26px; padding: 16px 16px 18px; margin-bottom: 16px; border: 6px solid #f9c9dc;
  background-color: #fbe3d6; background-image: radial-gradient(#e8b4a0 1px, transparent 1.3px), radial-gradient(#f4c7b5 1px, transparent 1.3px);
  background-size: 18px 18px, 18px 18px; background-position: 0 0, 9px 9px; box-shadow: inset 0 0 0 2px #fff6, 0 10px 28px rgba(219,39,119,.18); }
body.dark .corkboard { background-color: #3a2337; border-color: #5b2a4e; background-image: radial-gradient(#5b3a55 1px, transparent 1.3px); }
.board-title { font-family: var(--hand); font-size: 1.7rem; color: #9d174d; }
body.dark .board-title { color: var(--head); }
.new-note { background: linear-gradient(120deg, #fff 0%, #fdf2f8 60%, #f5f3ff 100%); border: 2px dashed #f472b6; border-radius: 18px;
            padding: 10px 14px; margin: 10px 0 14px; color: #5b2a4e; }
body.dark .new-note { background: var(--input); color: var(--text); }
.new-note summary { font-weight: 700; color: #db2777; }
.pins { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 12px; }
@media (min-width: 760px) { .pins { grid-template-columns: repeat(4, 1fr); } }
.pin-note { position: relative; padding: 22px 12px 10px; border-radius: 3px 3px 16px 3px; min-height: 86px; color: #5b2a4e;
            box-shadow: 0 8px 16px rgba(120,40,60,.18); }
.pin-note.soon { box-shadow: 0 0 0 3px #ec4899, 0 10px 22px rgba(236,72,153,.35); }
.pin-note.past { opacity: .55; filter: grayscale(.4); }
.pin-head { position: absolute; top: -13px; left: 50%; transform: translateX(-50%); font-size: 1.45rem; }
.pin-text { font-family: var(--hand); font-size: 1.2rem; line-height: 1.2; word-wrap: break-word; }
.pin-when { display: inline-block; font-size: .7rem; font-weight: 700; border-radius: 99px; padding: 2px 8px; background: #ffffffc0; color: #9d4b83; margin-top: 6px; }
.pin-when.soon { background: #ec4899; color: #fff; }
.pin-done { margin-top: 8px; border: none; background: #ffffffc0; border-radius: 99px; padding: 4px 10px; font-weight: 700; font-size: .75rem; color: #9d4b83; }
.board-empty { text-align: center; padding: 10px 0 4px; font-family: var(--hand); font-size: 1.2rem; color: #9d4b83; }
.pbox { border-radius: 26px; padding: 18px 18px 14px; margin-bottom: 16px; position: relative; overflow: hidden; }
.pbox.todo { background: linear-gradient(160deg, #ffe4f1 0%, #fdf2f8 45%, #f3e8ff 100%); box-shadow: 0 10px 28px rgba(236,72,153,.18); }
.pbox.tomorrow { background: linear-gradient(160deg, #e0e7ff 0%, #ede9fe 45%, #fce7f3 100%); box-shadow: 0 10px 28px rgba(99,102,241,.18); }

.summary { background: linear-gradient(120deg, #fde7f3, #efe3ff); border-radius: 22px; padding: 14px 18px; font-weight: 600; margin: 12px 0 4px;
           display: flex; flex-wrap: wrap; gap: 6px 22px; color: #5b2a4e; }
body.dark .summary { background: linear-gradient(120deg, #3a1d45, #2b1e4a); color: var(--text); }
.summary b { color: var(--head); font-size: 1.1rem; }

.hcard { background: var(--card); border-radius: 24px; padding: 14px 16px 16px; box-shadow: var(--shadow); border-top: 6px solid var(--c); }

.ring-fg { fill: none; stroke-width: 9; stroke-linecap: round; }

function textOn(hex) { const h = hex.replace("#", ""); const [r, g, b] = [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));
  return (0.299 * r + 0.587 * g + 0.114 * b) > 170 ? "#5b2a4e" : "#ffffff"; }

  t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  out.habits = (out.habits || []).map(h => Object.assign({ kind: "binary", unit: "", target: 1, color: "#ec4899", archived: 0,

  const maxId = Math.max(0, ...out.habits.map(h => h.id), ...out.todos.map(t => t.id), ...out.pins.map(p => p.id));
  out.nextId = Math.max(out.nextId || 1, maxId + 1);

}

    out += `<span class="${cls}" title="${tip}">${size > 11 ? inner : ""}</span>`;

}

    ${h ? `<label class="row" style="margin-top:10px;gap:8px"><input type="checkbox" name="archived"${h.archived ? " checked" : ""}> Archived (hidden, data is kept)</label>` : ""}
    <div class="row" style="margin-top:14px"><button class="btn primary" type="submit">${h ? "💾 Save" : "💖 Add habit"}</button>
    ${h ? `<span class="spacer"></span><button class="btn small danger" type="button" data-act="habit-del" data-id="${h.id}">🗑️ Delete</button>` : ""}</div></form>`;
}
function pageManage() {
  const all = [...S.habits].sort((a, b) => catIndex(a.category) - catIndex(b.category) || (a.position ?? a.id) - (b.position ?? b.id));
  let html = `<h1>🎀 Manage habits</h1><details class="card pop" ${all.length ? "" : "open"}><summary class="box-title">✨ New habit</summary>${habitForm(null)}</details>
    <div class="sec">🌷 Your habits</div>`;
  html += all.map(h => `<details class="mhabit"><summary>${CAT[h.category].icon} ${h.emoji} ${esc(h.name)}${daysLabel(h.days) ? ` <span class="days-tag">${daysLabel(h.days)}</span>` : ""}
    ${h.archived ? '<span class="soft">(archived)</span>' : ""}<span class="arrow">⌄</span></summary>${habitForm(h)}</details>`).join("") || `<div class="soft">No habits yet.</div>`;
  const act = activeHabits();
  if (act.length) { html += `<div class="sec">↕️ Order of your habits</div>`;
    for (const [cat, icon] of CATEGORIES) { const sub = act.filter(h => h.category === cat); if (!sub.length) continue;
      html += `<div class="cat-head" style="margin-top:8px">${icon} ${cat}</div>` + sub.map((h, i) => `<div class="sortrow"><div class="habit-pill" style="background:${h.color}33;border-color:${h.color}">${h.emoji} ${esc(h.name)}</div>
        <button class="btn" data-act="move" data-id="${h.id}" data-dir="-1" ${i === 0 ? "disabled style='opacity:.35'" : ""}>↑</button>
        <button class="btn" data-act="move" data-id="${h.id}" data-dir="1" ${i === sub.length - 1 ? "disabled style='opacity:.35'" : ""}>↓</button></div>`).join(""); } }
  html += `<div class="sec">💧 Water goal</div><div class="card"><form data-form="water-goal" class="row"><input type="number" name="liters" min="0.5" max="6" step="0.25" value="${S.settings.waterGoal / 1000}">
    <span class="muted">liters</span><button class="btn primary" type="submit">💾 Save</button></form></div>
    <div class="sec">💾 Backup</div><div class="card">${backupBlock()}</div>`;
  return html;
}
function backupBlock() {
  const lb = S.settings.lastBackup;
  return `<div class="soft">📦 Your data lives on this phone. Save a backup now and then (e.g. to Google Drive, iCloud or send it to yourself).</div>
    <div class="soft" style="margin-top:6px">Last backup: <b>${lb ? niceDay(parse(lb), todayD()) : "never"}</b></div>
    <div class="row" style="margin-top:12px;flex-wrap:wrap"><button class="btn primary" data-act="backup">💾 Save backup</button>
    <button class="btn soft" data-act="restore">📥 Restore backup</button></div>`;
}

// ============================================================
// Drawer: affirmation, rules, look
// ============================================================
function drawer() {
  const order = [...AFFIRMATIONS.keys()]; const rnd = seeded(2026); for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  const dayNo = Math.floor(todayD().getTime() / 86400000 - todayD().getTimezoneOffset() / 1440);
  const [kind, text, who] = AFFIRMATIONS[order[((dayNo % order.length) + order.length) % order.length]];
  const t = S ? S.settings.theme : "auto";
  return `<div class="brand" style="font-size:1.3rem;margin-bottom:14px">🌷 Glow Garden</div><div class="soft" style="margin-bottom:14px">Small steps, big glow-up ✨</div>
    <div class="card aff"><div class="box-title">🌸 Affirmation of the day</div><span class="aff-kind">${kind}</span><div class="aff-text">${esc(text)}</div>${who ? `<div class="aff-who">— ${esc(who)}</div>` : ""}</div>
    <div class="card"><div class="box-title">💎 Golden rules</div><div class="grule"><span>🌷</span>At least ${RULE_MIN} habits in every category, every day</div>
    <div class="grule"><span>🔁</span>Never miss a habit 2 days in a row</div></div>
    <div class="card"><div class="box-title">🎨 Look</div><div class="seg">${[["light", "☀️ Light"], ["dark", "🌙 Dark"], ["auto", "✨ Auto"]].map(([k, l]) =>
      `<button class="${t === k ? "on" : ""}" data-act="theme" data-t="${k}">${l}</button>`).join("")}</div><div class="soft" style="margin-top:6px">Auto = dark from 7 pm to 7 am</div></div>
    ${S ? `<div class="card"><div class="box-title">💾 Backup</div>${backupBlock()}</div>` : ""}`;
}

// ============================================================
// Rendering
// ============================================================
function render() {
  applyTheme();
  const app = $("#app");
  document.body.className = document.body.className.replace(/\bpage-\S+/g, "").trim();
  if (!S) { app.innerHTML = welcome(); $("#drawer").innerHTML = drawer(); $("#tabs").style.display = "none"; return; }
  $("#tabs").style.display = "";
  document.body.classList.add(`page-${ui.page}`);
  const pages = { garden: pageGarden, planner: pagePlanner, overview: pageOverview, manage: pageManage };
  app.classList.toggle("anim", ui.animate);
  app.innerHTML = pages[ui.page]();
  $("#drawer").innerHTML = drawer();
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("active", b.dataset.page === ui.page));
  ui.animate = false;
  // smooth fills: start from the previous value, then grow to the new one
  const fill = $("#tbarFill"), liq = $("#liquid");
  if (fill) { fill.style.height = `${ui.barPrev ?? 0}%`; requestAnimationFrame(() => requestAnimationFrame(() => fill.style.height = `${fill.dataset.to}%`)); ui.barPrev = +fill.dataset.to; }
  if (liq) { liq.style.height = `${ui.waterPrev ?? 0}%`; requestAnimationFrame(() => requestAnimationFrame(() => liq.style.height = `${liq.dataset.to}%`)); ui.waterPrev = +liq.dataset.to; }
}
function welcome() {
  return `<div class="welcome pop"><div class="big">🌷</div><h1>Welcome to Glow Garden</h1><p class="muted">Your habits, water, to-dos and pinboard, right here on your phone.</p>
    <div style="display:flex;flex-direction:column;gap:12px;max-width:320px;margin:24px auto">
    <button class="btn primary" data-act="restore">📥 Restore my backup</button><button class="btn soft" data-act="fresh">✨ Start fresh</button></div>
    <p class="soft">Coming from the old app? Choose “Restore my backup” and pick your <b>glow-garden-backup.json</b> file.</p></div>`;
}

// ============================================================
// Actions
// ============================================================
const actions = {
  page: d => { ui.page = d.page; ui.animate = true; window.scrollTo(0, 0); render(); },
  drawer: () => document.body.classList.toggle("drawer-open"),
  theme: d => { S.settings.theme = d.t; save(); render(); },
  week: d => { ui.weekOffset = +d.n === 0 ? 0 : ui.weekOffset + +d.n; render(); },
  cell: d => { const h = S.habits.find(x => x.id === +d.h); const day = parse(d.d);
    if (h.kind === "amount") return amountModal(h, day);
    const before = allDoneToday(); setVal(h, day, isDone(h, day) ? 0 : 1); afterToggle(before); },
  water: d => { const k = iso(todayD()); const goal = S.settings.waterGoal; const before = S.water[k] || 0;
    S.water[k] = Math.max(0, before + +d.ml); if (!S.water[k]) delete S.water[k]; save();
    if ((S.water[k] || 0) >= goal && before < goal) toast("2 liters done! Hydrated queen 💧👑"); render(); },
  lazy: () => { S.pauses[iso(todayD())] = "lazy"; save(); lazyParty(); ui.animate = true; render(); },
  back: () => { for (const k of Object.keys(S.pauses)) if (k >= iso(todayD())) delete S.pauses[k]; save(); balloons(); toast("Welcome back, queen! Let's glow ✨👑"); ui.animate = true; render(); },
  range: d => { ui.range = d.r; ui.animate = true; render(); },
  filter: d => { const id = +d.id; ui.hidden.has(id) ? ui.hidden.delete(id) : ui.hidden.add(id); render(); },
  "todo-toggle": d => { const t = S.todos.find(x => x.id === +d.id); t.done = t.done ? 0 : 1; save(); render(); },
  "todo-del": d => { S.todos = S.todos.filter(x => x.id !== +d.id); save(); render(); },
  "pin-del": d => { S.pins = S.pins.filter(x => x.id !== +d.id); save(); render(); },
  carry: () => { const t = iso(todayD()); S.todos.forEach(x => { if (x.kind === "day" && !x.done && x.day < t) x.day = t; }); save(); render(); },
  "to-tomorrow": () => { const t = iso(todayD()), tm = iso(addDays(todayD(), 1)); S.todos.forEach(x => { if (x.kind === "day" && !x.done && x.day === t) x.day = tm; }); save(); toast("Moved to tomorrow 🌙"); render(); },
  move: d => { const h = S.habits.find(x => x.id === +d.id); const sub = activeHabits().filter(x => x.category === h.category);
    const i = sub.indexOf(h), j = i + +d.dir; if (j < 0 || j >= sub.length) return; [sub[i], sub[j]] = [sub[j], sub[i]];
    sub.forEach((x, k) => x.position = k); save(); render(); },
  "habit-del": d => { const h = S.habits.find(x => x.id === +d.id);
    if (!confirm(`Delete "${h.name}" and all its check marks for good?`)) return;
    S.habits = S.habits.filter(x => x.id !== h.id); for (const k of Object.keys(S.entries)) if (k.startsWith(`${h.id}|`)) delete S.entries[k]; save(); render(); },
  backup: () => saveBackup(),
  restore: () => $("#restoreFile").click(),
  fresh: () => { S = emptyState(); save(); ui.page = "manage"; ui.animate = true; render(); },
};
function allDoneToday() { const t = todayD(); const p = activeHabits().filter(h => isOn(h, t)); return p.length > 0 && p.every(h => isDone(h, t)); }
function afterToggle(before) { const now = allDoneToday(); render(); if (now && !before) { balloons(); toast("All habits done for today! 👑💖"); } }
function amountModal(h, day) {
  const bg = document.createElement("div"); bg.className = "modal-bg";
  bg.innerHTML = `<div class="modal"><div class="box-title">${h.emoji} ${esc(h.name)}</div><div class="soft">${niceDay(day, todayD())} · goal ${h.target} ${esc(h.unit)}</div>
    <div class="stepper"><button class="btn soft" data-step="-1">−</button><input type="number" id="amt" value="${val(h, day)}" min="0" step="any"><button class="btn soft" data-step="1">＋</button></div>
    <div class="row"><button class="btn soft" data-close>Cancel</button><span class="spacer"></span><button class="btn primary" data-ok>💾 Save</button></div></div>`;
  document.body.appendChild(bg);
  bg.addEventListener("click", e => { const inp = bg.querySelector("#amt");
    if (e.target === bg || e.target.closest("[data-close]")) return bg.remove();
    const st = e.target.closest("[data-step]"); if (st) { inp.value = Math.max(0, (+inp.value || 0) + +st.dataset.step); return; }
    if (e.target.closest("[data-ok]")) { const before = allDoneToday(); setVal(h, day, +inp.value || 0); bg.remove(); afterToggle(before); } });
}

// ---------- forms ----------
document.addEventListener("submit", e => {
  const f = e.target.closest("form[data-form]"); if (!f) return; e.preventDefault(); const fd = new FormData(f);
  const type = f.dataset.form;
  if (type === "todo") { const text = (fd.get("text") || "").trim(); if (!text) return;
    S.todos.push({ id: newId(), kind: f.dataset.kind, day: f.dataset.day, text, done: 0 }); save(); render();
    const again = document.querySelector(`form[data-form="todo"][data-kind="${f.dataset.kind}"][data-day="${f.dataset.day}"] input`); if (again) again.focus(); }
  if (type === "pin") { const text = (fd.get("text") || "").trim(); if (!text) return;
    S.pins.push({ id: newId(), text, day: fd.get("day") || null, time: fd.get("time") || "", color: +fd.get("color") || 0, created: iso(todayD()) }); save(); toast("📌 Pinned!"); render(); }
  if (type === "water-goal") { S.settings.waterGoal = Math.round(+fd.get("liters") * 1000) || 2000; save(); toast("Saved 💧"); render(); }
  if (type === "habit") { const name = (fd.get("name") || "").trim(); if (!name) return toast("Please enter a name");
    const days = fd.getAll("days").sort().join("") || "0123456"; const kind = fd.get("kind") || "binary";
    const data = { name, emoji: fd.get("emoji"), category: fd.get("category"), color: fd.get("color") || "#ec4899", days,
      target: kind === "amount" ? (+fd.get("target") || 1) : 1, unit: kind === "amount" ? (fd.get("unit") || "").trim() : "" };
    if (f.dataset.id === "new") { S.habits.push(Object.assign({ id: newId(), kind, created: iso(todayD()), archived: 0, position: 999 }, data)); toast(`${data.emoji} "${name}" added!`); }
    else { const h = S.habits.find(x => x.id === +f.dataset.id); Object.assign(h, data, { archived: fd.get("archived") ? 1 : 0 }); toast("Saved 💾"); }
    save(); render(); }
});
document.addEventListener("click", e => { const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  if (el.closest("form") && el.type === "submit") return;
  const fn = actions[el.dataset.act]; if (fn) { if (el.closest("#drawer") && el.dataset.act !== "theme") document.body.classList.remove("drawer-open"); fn(el.dataset, el); } });

// ---------- backup ----------
async function saveBackup() {
  S.settings.lastBackup = iso(todayD()); save();
  const name = `glow-garden-backup-${iso(todayD())}.json`;
  const blob = new Blob([JSON.stringify(S, null, 1)], { type: "application/json" });
  try { const file = new File([blob], name, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Glow Garden backup" }); toast("Backup saved 💾"); render(); return; }
  } catch (err) { if (err && err.name === "AbortError") { render(); return; } }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); toast("Backup downloaded 💾"); render();
}
$("#restoreFile").addEventListener("change", async e => {
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  try { const data = JSON.parse(await file.text());
    if (!data || !Array.isArray(data.habits) || typeof data.entries !== "object") throw new Error("not a Glow Garden backup");
    if (S && S.habits.length && !confirm("Replace the data on this phone with this backup?")) return;
    S = normalize(data); save(); ui.page = "garden"; ui.animate = true; render(); balloons(); toast(`Welcome back! ${S.habits.length} habits restored 🌷`);
  } catch (err) { toast("⚠️ That file is not a Glow Garden backup"); }
});

// ============================================================
// Start
// ============================================================
S = load();
render();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { ui.barPrev = null; render(); } });
setInterval(() => { if (document.visibilityState === "visible" && !document.querySelector("input:focus,select:focus")) render(); }, 5 * 60 * 1000);
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
</html>
